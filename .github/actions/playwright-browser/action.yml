name: Install Playwright browser
description: Cache a Playwright browser and install it with OS dependencies.
inputs:
  browser:
    description: Browser passed to `playwright install` (chromium, firefox, or webkit).
    required: true
  with-deps:
    description: Also apt-install Playwright's OS dependencies. Chromium's libraries are already on ubuntu-latest; the extra packages are mostly fonts and a slow mirror can spend the whole smoke budget before a test starts. WebKit and Firefox still need it.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ inputs.browser }}-${{ hashFiles('package-lock.json') }}
    - shell: bash
      env:
        PLAYWRIGHT_BROWSER: ${{ inputs.browser }}
        PLAYWRIGHT_WITH_DEPS: ${{ inputs.with-deps }}
      run: |
        if [ "$PLAYWRIGHT_WITH_DEPS" = "true" ]; then
          npx playwright install --with-deps "$PLAYWRIGHT_BROWSER"
        else
          npx playwright install "$PLAYWRIGHT_BROWSER"
        fi

name: Install Playwright browser
description: Cache a Playwright browser and install it with OS dependencies.
inputs:
  browser:
    description: Browser passed to `playwright install` (chromium, firefox, or webkit).
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ inputs.browser }}-${{ hashFiles('package-lock.json') }}
    # OS packages are not part of the browser cache, so --with-deps still runs
    # on a hit. A hit skips the browser download, which is the slow part.
    - shell: bash
      env:
        PLAYWRIGHT_BROWSER: ${{ inputs.browser }}
      run: npx playwright install --with-deps "$PLAYWRIGHT_BROWSER"

name: Catalog agent fleet

on:
  schedule:
    # Daily: verification evidence is date-granular (verifiedAt), so more
    # frequent runs only churn timestamps and review bandwidth.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-agent-fleet
  cancel-in-progress: false

jobs:
  curate:
    name: Curate reviewed software catalog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run agents:run
        env:
          # Unauthenticated GitHub API calls share the runner IP's 60/hour
          # budget; the token keeps scout/verifier lookups reliable.
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run verify
      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Open a draft catalog review
        # Creating the draft PR needs "Allow GitHub Actions to create and
        # approve pull requests" enabled under Settings -> Actions -> General;
        # without it, `gh pr create` fails with "not permitted".
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Status, history, QA-report, and review-queue files re-stamp
          # timestamps on every run; only the curated records decide whether
          # there is anything for a human to review.
          if git diff --quiet -- catalog/inbox.json catalog/verified-tools.json catalog/mapped-tools.json catalog/edited-tools.json; then
            echo "No reviewable catalog changes."
            exit 0
          fi

          branch="agents/catalog-refresh"
          git config user.name "roamingeye-catalog-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add catalog public/data
          git commit -s -m "chore: refresh reviewed software catalog"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create --draft --base main --head "$branch" \
              --title "chore: review catalog agent refresh" \
              --body "Automated catalog refresh. Review catalog/review-queue.json and the generated public/data/software-catalog.json before approving."
          else
            echo "Standing draft review updated with a force-push."
          fi

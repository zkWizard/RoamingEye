name: Catalog agent fleet

on:
  schedule:
    # Daily: verification evidence is date-granular (verifiedAt), so more
    # frequent runs only churn timestamps and review bandwidth.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-agent-fleet
  cancel-in-progress: false

jobs:
  curate:
    name: Curate reviewed software catalog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run agents:run
        env:
          # Unauthenticated GitHub API calls share the runner IP's 60/hour
          # budget; the token keeps scout/verifier lookups reliable.
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run verify
      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium
      # Same required WebGL gate as ci.yml (the @smoke set). The full suite
      # is the nightly advisory workflow and was blocking this draft on a
      # keyboard-zoom assertion while spending about an hour on shards that
      # do not decide whether the catalog can open a review.
      - run: npm run test:e2e:smoke
      - name: Open a draft catalog review
        # Push uses the checkout credential (contents: write). gh uses
        # GH_TOKEN. An unset CATALOG_FLEET_TOKEN secret is empty, and the
        # runner then omits the automatic GITHUB_TOKEN for this step, so
        # the token is chosen here and passed explicitly. The fleet secret
        # wins only when it is non-empty. See docs/agent-fleet.md.
        env:
          GH_TOKEN: ${{ secrets.CATALOG_FLEET_TOKEN != '' && secrets.CATALOG_FLEET_TOKEN || github.token }}
          TOKEN_KIND: ${{ secrets.CATALOG_FLEET_TOKEN != '' && 'secret' || 'default' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Status, history, QA-report, and review-queue files re-stamp
          # timestamps on every run; only the curated records decide whether
          # there is anything for a human to review.
          branch="agents/catalog-refresh"
          repo="${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}"
          owner="${GITHUB_REPOSITORY_OWNER:-${repo%%/*}}"
          server="${GITHUB_SERVER_URL:-https://github.com}"
          compare_url="${server}/${repo}/compare/main...${branch}"
          summary_file="${GITHUB_STEP_SUMMARY:?GITHUB_STEP_SUMMARY is required}"

          write_summary() {
            {
              echo "### Catalog agent fleet"
              echo
              printf '%s\n' "$@"
            } >> "$summary_file"
          }

          if git diff --quiet -- catalog/inbox.json catalog/verified-tools.json catalog/mapped-tools.json catalog/edited-tools.json; then
            echo "No reviewable catalog changes."
            write_summary "No reviewable catalog changes, so ${branch} was left as it is."
            exit 0
          fi

          # Choose the token before publishing. Every expansion below uses
          # ${var:-} so `set -u` does not abort on an empty secret. The
          # workflow sets GH_TOKEN and TOKEN_KIND; a local run can instead
          # set CATALOG_FLEET_TOKEN and GITHUB_TOKEN.
          if [ "${TOKEN_KIND:-}" = "secret" ] && [ -n "${GH_TOKEN:-}" ]; then
            token_kind="secret"
          elif [ -n "${CATALOG_FLEET_TOKEN:-}" ]; then
            export GH_TOKEN="$CATALOG_FLEET_TOKEN"
            token_kind="secret"
          elif [ -n "${GITHUB_TOKEN:-}" ]; then
            export GH_TOKEN="$GITHUB_TOKEN"
            token_kind="default"
          elif [ -n "${GH_TOKEN:-}" ]; then
            token_kind="default"
          else
            echo "::error title=Catalog pull request was not opened::GITHUB_TOKEN is required to query pull requests."
            write_summary "No token was available to query pull requests, so ${branch} was not updated."
            exit 1
          fi

          git config user.name "roamingeye-catalog-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add catalog public/data
          git commit -s -m "chore: refresh reviewed software catalog"
          git push --force origin "$branch"

          existing_url="$(
            gh pr list \
              --repo "$repo" \
              --head "${owner}:${branch}" \
              --base main \
              --state open \
              --json url \
              --jq '.[0].url // empty' | tr -d '[:space:]'
          )"

          if [ -n "$existing_url" ]; then
            echo "Standing draft review updated with a force-push: ${existing_url}"
            write_summary \
              "Updated the open pull request for \`${branch}\` with a force-push." \
              "" \
              "- Pull request: ${existing_url}" \
              "- Compare: [${compare_url}](${compare_url})"
            exit 0
          fi

          set +e
          create_out="$(
            gh pr create \
              --repo "$repo" \
              --draft \
              --base main \
              --head "$branch" \
              --title "chore: review catalog agent refresh" \
              --body "Automated catalog refresh. Review catalog/review-queue.json and the generated public/data/software-catalog.json before approving." \
              2>&1
          )"
          create_status=$?
          set -e

          if [ "$create_status" -eq 0 ]; then
            printf '%s\n' "$create_out"
            write_summary \
              "Opened a draft pull request for \`${branch}\`." \
              "" \
              "- Pull request: ${create_out}" \
              "- Compare: [${compare_url}](${compare_url})"
            exit 0
          fi

          printf '%s\n' "$create_out" >&2

          if printf '%s\n' "$create_out" | grep -q "already exists"; then
            echo "A pull request for ${branch} is already open. The force-push updated it."
            write_summary \
              "A pull request for \`${branch}\` is already open. The force-push updated it." \
              "" \
              "- Compare: [${compare_url}](${compare_url})"
            exit 0
          fi

          if [ "$token_kind" = "default" ] && printf '%s\n' "$create_out" | grep -q "not permitted to create or approve pull requests"; then
            echo "Catalog refresh is on ${branch}. Compare: ${compare_url}"
            echo "::warning title=Catalog pull request was not opened::GitHub Actions is not permitted to create pull requests with the default token, and CATALOG_FLEET_TOKEN is not set. The refresh was pushed to ${branch}. Compare: ${compare_url}"
            write_summary \
              "Pushed \`${branch}\`. Open the pull request from the compare link. Later runs update that pull request." \
              "" \
              "The default \`GITHUB_TOKEN\` cannot create pull requests in this repository, and the \`CATALOG_FLEET_TOKEN\` secret is unset. The catalog refresh is on the branch." \
              "" \
              "- Compare: [${compare_url}](${compare_url})" \
              "" \
              "To open the draft from this workflow, store a fine-grained personal access token or a GitHub App installation token in the Actions secret \`CATALOG_FLEET_TOKEN\` (pull requests: read and write on this repository). A personal access token is the durable choice. An installation token expires after one hour. Allowing GitHub Actions to create and approve pull requests under Settings > Actions > General also lets the default token open the pull request."
            exit 0
          fi

          echo "::error title=Catalog pull request was not opened::gh pr create failed with exit ${create_status}."
          exit "$create_status"

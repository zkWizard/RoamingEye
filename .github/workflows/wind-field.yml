name: Wind field

# Nightly 2.5 degree global wind and temperature grid for the Weather now
# overlay. The browser loads public/data/wind/latest.bin, so visitors do not
# each call Open-Meteo. This workflow is the data producer. It does not change
# the CI checks.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wind-field
  cancel-in-progress: false

jobs:
  build:
    name: Build wind field
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Fetch Open-Meteo and write the grid
        run: node --experimental-strip-types scripts/build-wind-field.mjs
      - name: Commit the field
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/wind/latest.bin public/data/wind/latest.json
          if git diff --cached --quiet; then
            echo "Wind field is unchanged."
            exit 0
          fi
          git commit -s -m "Update the nightly wind field"
          git push
